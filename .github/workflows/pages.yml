name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A3F304: ${{ secrets.A3F304 }}
          B76DBF: ${{ secrets.B76DBF }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A3F304', '')
          env_b = os.environ.get('B76DBF', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 274378bdd80af744a6f8aa69d1ce7d37ac4d -->', env_a)
          if env_b:
              result = result.replace('<!-- 8e80ad4e564a9ebacea69a51 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
